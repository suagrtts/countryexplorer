<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header with Globe Logo and Title -->
  <header class="navbar">
    <div class="navbar-content">
      <img src="assets/world.png" alt="Country Explorer Logo" class="navbar-logo">
      <h1 class="navbar-title">Country Explorer</h1>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="main-container">
    <!-- Filter Section -->
    <section class="filter-card">
      <div class="filter-grid">
        <!-- Search by Country Name -->
        <div class="filter-group">
          <label for="country-search">Search by Country Name:</label>
          <input 
            type="text" 
            id="country-search" 
            placeholder="Search by Country Name..." 
            autocomplete="off"
          >
          <span id="name-error" class="error-text"></span>
        </div>

        <!-- Select a Region -->
        <div class="filter-group">
          <label for="region-filter">Select a Region:</label>
          <select id="region-filter">
            <option value="All Regions">All Regions</option>
            <option value="Africa">Africa</option>
            <option value="Americas">Americas</option>
            <option value="Asia">Asia</option>
            <option value="Europe">Europe</option>
            <option value="Oceania">Oceania</option>
            <option value="Antarctic">Antarctic</option>
          </select>
        </div>

        <!-- Search by Population -->
        <div class="filter-group">
          <label for="population-search">Search by Population:</label>
          <input 
            type="number" 
            id="population-search" 
            value="0" 
            min="0" 
            max="1500000000"
          >
          <span class="helper-text">Max - 1.5 billion (1500000000)</span>
          <span id="population-error" class="error-text"></span>
        </div>
      </div>
    </section>

    <!-- Status / Loading / Message -->
    <div id="status-message" class="status-message"></div>

    <!-- Country Cards Grid -->
    <section id="country-grid" class="country-grid">
      <!-- Dynamically generated country cards -->
    </section>

    <!-- Show More Action -->
    <div class="show-more-wrapper">
      <button id="show-more-btn" class="btn-show-more">Show More</button>
    </div>
  </main>

  <!-- Main script -->
  <script src="script.js"></script>
</body>
</html>
